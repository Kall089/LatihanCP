<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Tailwind CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-6xl px-4 py-12 sm:px-6 lg:px-8">
      <header class="mb-10">
        <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl">Jalur Belajar Web</h1>
        <p class="mt-3 text-lg text-slate-600">Pilih materi yang ingin kamu pelajari hari ini.</p>
      </header>

      <section class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
        <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
          <p class="text-sm font-semibold text-blue-600">01</p>
          <h2 class="mt-3 text-xl font-bold">HTML Semantik</h2>
          <p class="mt-2 text-slate-600">Susun halaman yang bermakna dan mudah diakses.</p>
        </article>

        <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
          <p class="text-sm font-semibold text-blue-600">02</p>
          <h2 class="mt-3 text-xl font-bold">Layout CSS</h2>
          <p class="mt-2 text-slate-600">Kuasai Flexbox, Grid, dan desain responsif.</p>
        </article>

        <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
          <p class="text-sm font-semibold text-blue-600">03</p>
          <h2 class="mt-3 text-xl font-bold">Next.js</h2>
          <p class="mt-2 text-slate-600">Bangun aplikasi menggunakan App Router.</p>
        </article>
      </section>

      <a class="mt-8 inline-block rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600" href="#">Mulai belajar</a>
    </main>
  </body>
</html>
