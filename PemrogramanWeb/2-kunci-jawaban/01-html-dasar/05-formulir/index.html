<!doctype html>
<html lang="id"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Pendaftaran Kelas</title></head>
<body><main><h1>Daftar Kelas Web</h1><form action="#" method="post">
  <p><label for="name">Nama lengkap</label><input id="name" name="name" required /></p>
  <p><label for="email">Email</label><input id="email" name="email" type="email" required /></p>
  <p><label for="course">Kelas</label><select id="course" name="course"><option>HTML</option><option>CSS</option><option>JavaScript</option></select></p>
  <fieldset><legend>Waktu belajar</legend><label><input type="radio" name="schedule" value="pagi" /> Pagi</label><label><input type="radio" name="schedule" value="malam" /> Malam</label></fieldset>
  <p><label for="reason">Alasan belajar</label><textarea id="reason" name="reason"></textarea></p>
  <p><label><input type="checkbox" name="agreement" required /> Saya menyetujui aturan kelas</label></p>
  <button type="submit">Daftar</button>
</form></main></body></html>
