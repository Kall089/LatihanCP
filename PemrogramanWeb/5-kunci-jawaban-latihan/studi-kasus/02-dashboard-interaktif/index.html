<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Pesanan — Warung Kopi Senja</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <h1 class="text-xl font-bold">Dashboard Pesanan</h1>
      <p class="text-sm text-slate-500">Warung Kopi Senja</p>
    </div>
  </header>

  <main class="mx-auto grid max-w-6xl gap-6 px-4 py-8 lg:grid-cols-3">
    <section class="space-y-6 lg:col-span-2">
      <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <p class="text-sm text-slate-500">Item yang tampil</p>
        <p id="total" class="text-3xl font-bold">0</p>
      </div>

      <div id="filter" class="flex flex-wrap gap-2">
        <button type="button" data-kategori="semua" class="rounded-full bg-slate-900 px-4 py-2 text-sm text-white">Semua</button>
        <button type="button" data-kategori="kopi" class="rounded-full bg-white px-4 py-2 text-sm ring-1 ring-slate-200">Kopi</button>
        <button type="button" data-kategori="nonkopi" class="rounded-full bg-white px-4 py-2 text-sm ring-1 ring-slate-200">Nonkopi</button>
        <button type="button" data-kategori="snack" class="rounded-full bg-white px-4 py-2 text-sm ring-1 ring-slate-200">Snack</button>
      </div>

      <ul id="daftar" class="grid grid-cols-1 gap-4 md:grid-cols-2"></ul>
    </section>

    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="text-lg font-semibold">Tambah pesanan</h2>
      <p id="pesan" class="mt-2 min-h-6 text-sm text-rose-600" role="alert"></p>
      <form id="form-pesanan" class="mt-4 space-y-4">
        <div>
          <label for="nama" class="block text-sm font-medium">Nama item</label>
          <input id="nama" name="nama" type="text" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
        </div>
        <div>
          <label for="kategori" class="block text-sm font-medium">Kategori</label>
          <select id="kategori" name="kategori" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
            <option value="kopi">Kopi</option>
            <option value="nonkopi">Nonkopi</option>
            <option value="snack">Snack</option>
          </select>
        </div>
        <div>
          <label for="harga" class="block text-sm font-medium">Harga (angka)</label>
          <input id="harga" name="harga" type="number" min="0" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
        </div>
        <button type="submit" class="w-full rounded-lg bg-sky-600 py-2 font-semibold text-white hover:bg-sky-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-400">
          Simpan
        </button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
