<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runut Lanjut — Greedy &amp; DP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f5f3;
        --putih: #fff;
        --tinta: #16191c;
        --sedang: #54606b;
        --pudar: #8b959d;
        --garis: #e3e5e2;
        --garis2: #d2d5d1;
        --aksen: #1c6f6a;
        --ka: #8a5a00;
        --kab: #fbefd4;
        --kar: #ebd5a3;
        --kh: #0b6046;
        --khb: #dff0e7;
        --khr: #a9d6c2;
        --kb: #9a3838;
        --kbb: #fae6e4;
        --kbr: #ebbdb8;
        --ks: #43407f;
        --ksb: #eae9f6;
        --ksr: #c4c1e6;
        --body: "Instrument Sans", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--tinta);
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--kab);
      }
      .shell {
        display: grid;
        grid-template-columns: 256px 1fr;
        min-height: 100vh;
      }
      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }
      }
      aside {
        border-right: 1px solid var(--garis);
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 26px 0 48px;
      }
      @media (max-width: 900px) {
        aside {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--garis);
          padding-bottom: 18px;
        }
      }
      .brand {
        padding: 0 24px 16px;
      }
      .brand h1 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .brand p {
        font-size: 12px;
        color: var(--pudar);
        margin-top: 2px;
      }
      .bab {
        padding: 18px 24px 6px;
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--pudar);
      }
      .nl {
        display: flex;
        gap: 9px;
        align-items: baseline;
        padding: 5px 24px;
        cursor: pointer;
        font-size: 13px;
        color: var(--sedang);
        border-left: 2px solid transparent;
        transition: 0.12s;
      }
      .nl .no {
        font-family: var(--mono);
        font-size: 9.5px;
        color: var(--pudar);
        min-width: 26px;
      }
      .nl:hover {
        color: var(--tinta);
        background: rgba(0, 0, 0, 0.025);
      }
      .nl.on {
        color: var(--aksen);
        border-left-color: var(--aksen);
        font-weight: 600;
        background: rgba(28, 111, 106, 0.05);
      }
      .nl.on .no {
        color: var(--aksen);
      }
      main {
        padding: 44px 44px 100px;
        max-width: 900px;
      }
      @media (max-width: 640px) {
        main {
          padding: 26px 18px 70px;
        }
      }
      .eb {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--pudar);
      }
      h2.jd {
        font-size: clamp(25px, 4.2vw, 33px);
        font-weight: 600;
        letter-spacing: -0.026em;
        line-height: 1.15;
        margin: 9px 0 8px;
      }
      .sb {
        color: var(--sedang);
        font-size: 15.5px;
        max-width: 62ch;
        margin-bottom: 32px;
      }
      .sec {
        margin: 42px 0 16px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .sec h3 {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .sec .rl {
        flex: 1;
        height: 1px;
        background: var(--garis2);
      }
      .mt {
        margin-bottom: 22px;
      }
      .mt h4 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 7px;
      }
      .mt p {
        color: var(--sedang);
        font-size: 14.5px;
        max-width: 66ch;
      }
      .mt p + p {
        margin-top: 10px;
      }
      .mt strong {
        color: var(--tinta);
        font-weight: 600;
      }
      .mt.kunci {
        border-left: 2px solid var(--aksen);
        padding-left: 18px;
      }
      .mt.kunci h4 {
        color: var(--aksen);
      }
      code.c {
        font-family: var(--mono);
        font-size: 12.5px;
        background: rgba(0, 0, 0, 0.045);
        padding: 1.5px 5px;
        border-radius: 3px;
      }
      .ol {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--pudar);
        margin-bottom: 6px;
      }
      .og {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 13px;
      }
      button.o {
        font-family: var(--body);
        font-size: 12.5px;
        background: var(--putih);
        color: var(--sedang);
        border: 1px solid var(--garis2);
        border-radius: 5px;
        padding: 6px 12px;
        cursor: pointer;
        transition: 0.12s;
      }
      button.o:hover {
        border-color: var(--pudar);
        color: var(--tinta);
      }
      button.o.on {
        background: var(--tinta);
        color: var(--putih);
        border-color: var(--tinta);
        font-weight: 500;
      }
      .bar {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 16px;
      }
      button.b {
        font-family: var(--body);
        font-size: 13.5px;
        background: var(--putih);
        color: var(--tinta);
        border: 1px solid var(--garis2);
        border-radius: 6px;
        padding: 8px 15px;
        cursor: pointer;
        transition: 0.12s;
      }
      button.b:hover:not(:disabled) {
        border-color: var(--pudar);
      }
      button.b:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      button.b.u {
        background: var(--tinta);
        color: var(--putih);
        border-color: var(--tinta);
        font-weight: 500;
      }
      button.b.run {
        background: var(--aksen);
        color: #fff;
        border-color: var(--aksen);
      }
      .st {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--pudar);
        margin-bottom: 6px;
      }
      .nr {
        font-size: 14.5px;
        min-height: 48px;
        margin-bottom: 22px;
        color: var(--sedang);
        max-width: 72ch;
      }
      .nr b {
        color: var(--tinta);
      }
      .tg {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.08em;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 3px;
        margin-right: 9px;
        vertical-align: 1.5px;
        border: 1px solid;
      }
      .pn {
        background: var(--putih);
        border: 1px solid var(--garis);
        border-radius: 8px;
        padding: 18px 20px;
        margin-bottom: 14px;
      }
      .pl {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--pudar);
        margin-bottom: 13px;
      }
      .scroll {
        overflow-x: auto;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .cl {
        text-align: center;
      }
      .cl .i {
        font-family: var(--mono);
        font-size: 9.5px;
        color: var(--pudar);
        margin-bottom: 4px;
        height: 13px;
      }
      .cl .v {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 500;
        min-width: 40px;
        padding: 9px 7px;
        border: 1px solid var(--garis2);
        border-radius: 5px;
        background: var(--putih);
        transition: 0.15s;
      }
      .cl .u {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--pudar);
        margin-top: 5px;
        height: 14px;
      }
      .cl.a .v {
        background: var(--kab);
        border-color: var(--kar);
        color: var(--ka);
        font-weight: 700;
      }
      .cl.h .v {
        background: var(--khb);
        border-color: var(--khr);
        color: var(--kh);
      }
      .cl.b .v {
        background: var(--kbb);
        border-color: var(--kbr);
        color: var(--kb);
      }
      .cl.s .v {
        background: var(--ksb);
        border-color: var(--ksr);
        color: var(--ks);
      }
      .cl.dim {
        opacity: 0.3;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 860px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
      .code {
        background: var(--putih);
        border: 1px solid var(--garis);
        border-radius: 8px;
        padding: 14px 0;
        overflow-x: auto;
        margin-bottom: 14px;
      }
      .cb {
        display: flex;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.9;
        border-left: 2px solid transparent;
      }
      .cb .n {
        width: 28px;
        flex: none;
        text-align: right;
        padding-right: 11px;
        color: #c3c8cc;
        user-select: none;
      }
      .cb .t {
        white-space: pre;
        color: var(--sedang);
        padding-right: 20px;
      }
      .cb .cm {
        color: var(--pudar);
      }
      .cb.on {
        background: var(--kab);
        border-left-color: var(--kar);
      }
      .cb.on .t {
        color: var(--tinta);
      }
      .cb.on.h {
        background: var(--khb);
        border-left-color: var(--khr);
      }
      .cb.on.b {
        background: var(--kbb);
        border-left-color: var(--kbr);
      }
      .cb.on.s {
        background: var(--ksb);
        border-left-color: var(--ksr);
      }
      .full {
        background: #fafbfa;
        border: 1px solid var(--garis);
        border-radius: 8px;
        overflow: hidden;
      }
      .full .fh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 16px;
        border-bottom: 1px solid var(--garis);
        background: var(--putih);
      }
      .full .fh span {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--pudar);
      }
      .full pre {
        margin: 0;
        padding: 16px 18px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.75;
        color: var(--tinta);
      }
      .full .cm {
        color: var(--pudar);
      }
      button.cp {
        font-family: var(--body);
        font-size: 12px;
        background: var(--putih);
        color: var(--sedang);
        border: 1px solid var(--garis2);
        border-radius: 5px;
        padding: 5px 11px;
        cursor: pointer;
      }
      button.cp:hover {
        border-color: var(--pudar);
        color: var(--tinta);
      }
      button.cp.ok {
        background: var(--khb);
        border-color: var(--khr);
        color: var(--kh);
      }
      .hg {
        background: var(--putih);
        border: 1px solid var(--garis);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 14px;
      }
      .hg .hh {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--pudar);
        padding: 14px 18px 9px;
      }
      .hr {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        border-top: 1px solid var(--garis);
      }
      .hr .l {
        font-size: 13.5px;
        color: var(--sedang);
        flex: 1;
      }
      .hr .e {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--pudar);
        text-align: right;
      }
      .hr .v {
        font-family: var(--mono);
        font-size: 17px;
        font-weight: 600;
        min-width: 40px;
        text-align: right;
      }
      .hr.win {
        background: var(--khb);
      }
      .hr.win .v,
      .hr.win .l {
        color: var(--kh);
      }
      .hr.lose .v {
        color: var(--pudar);
      }
      .sp {
        margin: 12px 18px 16px;
        padding: 10px 13px;
        border-radius: 6px;
        font-family: var(--mono);
        font-size: 12px;
        background: rgba(0, 0, 0, 0.03);
        border: 1px solid var(--garis);
      }
      .sp.ok {
        background: var(--khb);
        border-color: var(--khr);
        color: var(--kh);
      }
      .sp.no {
        background: var(--kbb);
        border-color: var(--kbr);
        color: var(--kb);
      }
      .stk {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .fr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-family: var(--mono);
        font-size: 12.5px;
        padding: 8px 12px;
        border-radius: 5px;
        background: var(--putih);
        border: 1px solid var(--garis2);
        color: var(--sedang);
      }
      .fr.top {
        background: var(--ksb);
        border-color: var(--ksr);
        color: var(--ks);
      }
      .kosong {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--pudar);
      }
      table.dp {
        border-collapse: separate;
        border-spacing: 2px;
        font-family: var(--mono);
        font-size: 11px;
      }
      table.dp td.hd {
        padding: 3px 6px;
        color: var(--pudar);
        font-size: 9.5px;
        white-space: nowrap;
      }
      table.dp td.hd.on {
        color: var(--ka);
        font-weight: 700;
      }
      .dc {
        min-width: 28px;
        padding: 6px 3px;
        text-align: center;
        border: 1px solid var(--garis2);
        border-radius: 4px;
        background: var(--putih);
      }
      .dc.f {
        background: #f0f5f2;
        border-color: #d6e4dc;
      }
      .dc.n {
        background: var(--kab);
        border-color: var(--kar);
        color: var(--ka);
        font-weight: 700;
      }
      .dc.a {
        background: var(--ksb);
        border-color: var(--ksr);
        color: var(--ks);
      }
      .dc.b {
        background: var(--khb);
        border-color: var(--khr);
        color: var(--kh);
      }
      .dc.x {
        background: var(--kbb);
        border-color: var(--kbr);
        color: var(--kb);
      }
      .dc.j {
        background: var(--khb);
        border-color: var(--kh);
        color: var(--kh);
        font-weight: 700;
      }
      .hs {
        border: 1px solid var(--khr);
        background: var(--khb);
        border-radius: 8px;
        padding: 16px 20px;
        margin-bottom: 14px;
      }
      .hs.no {
        border-color: var(--kbr);
        background: var(--kbb);
      }
      .hs .a {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--kh);
      }
      .hs.no .a {
        color: var(--kb);
      }
      .hs .k {
        font-size: 13.5px;
        color: var(--sedang);
        margin-top: 4px;
      }
      table.tc {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
        background: var(--putih);
        border: 1px solid var(--garis);
        border-radius: 8px;
        overflow: hidden;
      }
      table.tc th {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--pudar);
        text-align: left;
        padding: 11px 14px;
        border-bottom: 1px solid var(--garis);
        font-weight: 400;
        background: #fafbfa;
      }
      table.tc td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--garis);
        vertical-align: top;
        color: var(--sedang);
      }
      table.tc tr:last-child td {
        border-bottom: 0;
      }
      table.tc td.io {
        font-family: var(--mono);
        font-size: 12px;
        white-space: pre-line;
        color: var(--tinta);
      }
      table.tc td.ou {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        color: var(--kh);
      }
      .tepi {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--kb);
        background: var(--kbb);
        border: 1px solid var(--kbr);
        border-radius: 3px;
        padding: 1px 5px;
        margin-right: 8px;
      }
      .sl {
        background: var(--putih);
        border: 1px solid var(--garis);
        border-radius: 8px;
        padding: 20px 22px;
      }
      .sl h4 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .sl > p {
        color: var(--sedang);
        font-size: 14px;
        max-width: 66ch;
      }
      .sl dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 20px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--garis);
      }
      .sl dt {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--pudar);
        padding-top: 3px;
      }
      .sl dd {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--tinta);
        white-space: pre-line;
      }
      .sl .ct {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--garis);
        font-size: 13.5px;
        color: var(--sedang);
      }
      .sl .ct b {
        color: var(--aksen);
      }
      svg text {
        font-family: var(--mono);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand">
          <h1>Runut Lanjut</h1>
          <p>greedy &amp; dynamic programming</p>
        </div>
        <nav id="nav"></nav>
      </aside>
      <main>
        <div class="eb" id="eb"></div>
        <h2 class="jd" id="jd"></h2>
        <p class="sb" id="sb"></p>
        <div id="materi"></div>
        <div class="sec">
          <h3>Jalankan</h3>
          <div class="rl"></div>
        </div>
        <div id="opsi"></div>
        <div class="bar">
          <button class="b" id="bp">← Mundur</button
          ><button class="b u" id="bn">Maju →</button>
          <button class="b" id="ba">Putar</button
          ><button class="b" id="bs">Ke hasil</button
          ><button class="b" id="br">Ulang</button>
        </div>
        <div class="st" id="stt"></div>
        <p class="nr" id="nr"></p>
        <div class="two">
          <div id="kol1"></div>
          <div id="kol2"></div>
        </div>
        <div id="hasil"></div>
        <div class="sec">
          <h3>Kode lengkap</h3>
          <div class="rl"></div>
        </div>
        <div id="full"></div>
        <div class="sec">
          <h3>Test case</h3>
          <div class="rl"></div>
        </div>
        <div id="tc"></div>
        <div class="sec">
          <h3>Soal</h3>
          <div class="rl"></div>
        </div>
        <div id="soal"></div>
      </main>
    </div>
    <script>
      const E = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      const TAG = {
        mulai: ["MULAI", "var(--pudar)", "transparent", "var(--garis2)"],
        cek: ["CEK", "var(--ka)", "var(--kab)", "var(--kar)"],
        pilih: ["PILIH", "var(--ka)", "var(--kab)", "var(--kar)"],
        ambil: ["AMBIL", "var(--kh)", "var(--khb)", "var(--khr)"],
        rekor: ["REKOR", "var(--kh)", "var(--khb)", "var(--khr)"],
        jawab: ["JAWAB", "var(--kh)", "var(--khb)", "var(--khr)"],
        tambah: ["TAMBAH", "var(--kh)", "var(--khb)", "var(--khr)"],

              "<strong>Tidak</strong> → dia menggantikan ekor pertama yang ≥ dirinya. Panjang tidak bertambah, tapi ujungnya jadi lebih kecil — lebih menjanjikan untuk masa depan.",
            ],
          },
          {
            h: "Peringatan penting",
            p: [
              'Isi <code class="c">ekor</code> <strong>bukan</strong> LIS yang sebenarnya. Cuma panjangnya yang benar. Jangan mencetak isinya sebagai jawaban.',
              'Untuk versi non-menurun (boleh sama), ganti <code class="c">lower_bound</code> jadi <code class="c">upper_bound</code>.',
            ],
          },
        ],
        kode: [
          "vector<int> ekor;    // ekor[k] = nilai terkecil untuk LIS panjang k+1",
          "",
          "for (int x : a) {",
          "    auto it = lower_bound(ekor.begin(), ekor.end(), x);",
          "",
          "    if (it == ekor.end())",
          "        ekor.push_back(x);        // perpanjang",
          "    else",
          "        *it = x;                  // perkecil ekornya",
          "}",
          "",
          "cout << ekor.size();",
        ],
        full: `#include <bits/stdc++.h>
using namespace std;

int main() {
    ios_base::sync_with_stdio(false);
    cin.tie(NULL);

    int n;
    cin >> n;

    vector<int> ekor;                  // ekor[k] = nilai terkecil untuk LIS panjang k+1

    for (int i = 0; i < n; i++) {
        int x;
        cin >> x;

        auto it = lower_bound(ekor.begin(), ekor.end(), x);

        if (it == ekor.end()) ekor.push_back(x);   // perpanjang
        else                  *it = x;              // perkecil ekornya
    }

    cout << ekor.size() << "\\n";
}`,
        opsi: [
          {
            k: "set",
            l: "kasus uji",
            p: [0, 1, 2],
            t: (v) => ["10 9 2 5 3 7 101 18", "0 1 0 3 2 3", "7 7 7 7"][v],
          },
        ],
        inp: { set: 0 },
        build(I) {
          const SET = [
            [10, 9, 2, 5, 3, 7, 101, 18],
            [0, 1, 0, 3, 2, 3],
            [7, 7, 7, 7],
          ];
          const A = SET[I.set],
            n = A.length,
            S = [];
          let ekor = [];
          S.push({
            A,
            ekor: [],
            i: null,
            ln: [1],
            tag: "mulai",
            ck: null,
            d: "Array ekor masih kosong. Panjangnya nanti = panjang LIS.",
          });
          for (let i = 0; i < n; i++) {
            const x = A[i];
            let pos = 0;
            while (pos < ekor.length && ekor[pos] < x) pos++;
            const perpanjang = pos === ekor.length;
            S.push({
              A,
              ekor: ekor.slice(),
              i,
              ln: [4],
              tag: "cek",
              pos,
              d: `Angka ${x}. Cari posisi pertama di ekor yang nilainya ≥ ${x}.`,
              ck: {
                x,
                pos,
                perpanjang,
                lama: perpanjang ? null : ekor[pos],
                panjang: ekor.length,
              },
            });
            ekor = ekor.slice();
            if (perpanjang) {
              ekor.push(x);
              S.push({
                A,
                ekor: ekor.slice(),
                i,
                ln: [6, 7],
                tag: "tambah",
                pos,
                ck: null,
                d: `${x} lebih besar dari semua ekor — LIS bertambah panjang jadi <b>${ekor.length}</b>.`,
              });
            } else {
              const lama = ekor[pos];
              ekor[pos] = x;
              S.push({
                A,
                ekor: ekor.slice(),
                i,
                ln: [8, 9],
                tag: "tetap",
                pos,
                ck: null,
                d: `Ganti ekor[${pos}] dari ${lama} jadi ${x}. Panjang tidak berubah, tapi ujungnya lebih kecil — lebih menjanjikan.`,
              });
            }
          }
          S.push({
            A,
            ekor: ekor.slice(),
            i: null,
            ln: [12],
            tag: "selesai",
            ck: null,
            d: `Selesai. Panjang LIS = <b>${ekor.length}</b>.`,
            end: { v: ekor.length, ekor: ekor.slice() },
          });
          return S;
        },
        kiri(s) {
          let h = pn(
            "Array masukan",
            `<div class="row">${s.A.map((v, k) => cl(v, { i: k, c: (s.i === k ? "a" : "") + (s.i !== null && k > s.i ? " dim" : "") })).join("")}</div>`,
          );
          if (s.ck)
            h += hg(
              `Angka ${s.ck.x}`,
              [
                { l: "panjang ekor sekarang", v: s.ck.panjang },
                {
                  l: "posisi pertama yang ≥ angka ini",
                  v: s.ck.perpanjang ? "tidak ada" : s.ck.pos,
                },
                ...(s.ck.perpanjang
                  ? []
                  : [{ l: `nilai yang akan diganti`, v: s.ck.lama }]),
              ],
              {
                j: s.ck.perpanjang ? "ok" : "",
                t: s.ck.perpanjang
                  ? "lebih besar dari semua → LIS bertambah panjang"
                  : "ganti dengan yang lebih kecil → panjang tetap, ujung lebih menjanjikan",
              },
            );
          return h;
        },
        kanan(s) {
          let h = pn(
            "Array ekor — panjangnya = panjang LIS",
            s.ekor.length
              ? `<div class="row">${s.ekor.map((v, k) => cl(v, { i: k, c: s.pos === k ? "a" : "h" })).join("")}</div>`
              : '<div class="kosong">kosong</div>',
          );
          if (s.end)
            h += `<p style="font-size:13.5px;color:var(--sedang);padding:0 2px;line-height:1.6">Isi ekor <b>bukan</b> LIS yang sebenarnya. Untuk kasus ini ekor berisi ${s.end.ekor.join(", ")}, tapi LIS aslinya bisa berbeda. Yang benar cuma panjangnya.</p>`;
          return h;
        },
        end(s) {
          return s.end
            ? hs(
                s.end.v,
                "Panjangnya benar. Isi array ekor bukan LIS yang sebenarnya.",
              )
            : "";
        },
        tests: [
          ["8\n10 9 2 5 3 7 101 18", "4", "kasus klasik"],
          ["6\n0 1 0 3 2 3", "4", "ada yang berulang"],
          ["4\n7 7 7 7", "1", "semua sama", 1],
          ["1\n5", "1", "satu elemen", 1],
          ["5\n5 4 3 2 1", "1", "menurun terus", 1],
        ],
        soal: {
          j: "Longest Increasing Subsequence (cepat)",
          i: "Sama dengan B5.1, tapi untuk n sampai 10⁵. Cari panjang sub-urutan menaik terpanjang dalam waktu O(n log n).",
          io: [
            ["Input", "Baris 1: n\nBaris 2: n bilangan"],
            ["Output", "Satu bilangan"],
            ["Batas", "1 ≤ n ≤ 10⁵"],
            ["Contoh", "8\n10 9 2 5 3 7 101 18"],
            ["Hasil", "4"],
          ],
          c: "Isi array ekor bukan LIS yang sebenarnya. Untuk versi non-menurun, ganti lower_bound jadi upper_bound.",
        },
      };

      /* ===== RUNTIME ===== */
      const URUT = [
        "perahu",
        "duakota",
        "interval",
        "jadwal",
        "tali",
        "pom",
        "tangga",
        "robber",
        "decode",
        "lompat",
        "bagi",
        "cara",
        "target",
        "lcs",
        "edit",
        "palin",
        "jalur",
        "grid",
        "lis",
        "lisfast",
      ];
      let AK = "perahu",
        S = [],
        I = 0,
        T = null,
        INP = {};
      function nav() {
        let h = "",
          bl = "";
        URUT.forEach((k) => {
          const m = M[k];
          if (m.bab !== bl) {
            h += `<div class="bab">${m.bab}</div>`;
            bl = m.bab;
          }
          h += `<div class="nl ${k === AK ? "on" : ""}" data-k="${k}"><span class="no">${m.no}</span><span>${m.judul}</span></div>`;
        });
        E("nav").innerHTML = h;
        document
          .querySelectorAll(".nl")
          .forEach((el) => (el.onclick = () => pilih(el.dataset.k)));
      }
      function pilih(k) {
        AK = k;
        const m = M[k];
        INP = Object.assign({}, m.inp || {});
        nav();
        E("eb").textContent = m.bab;
        E("jd").textContent = m.judul;
        E("sb").textContent = m.sub;
        E("materi").innerHTML = (m.materi || [])
          .map(
            (x) =>
              `<div class="mt ${x.k ? "kunci" : ""}"><h4>${x.h}</h4>${x.p.map((p) => `<p>${p}</p>`).join("")}</div>`,
          )
          .join("");
        opsi();
        fullkode();
        test();
        soal();
        reset();
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      function opsi() {
        const m = M[AK];
        if (!m.opsi || !m.opsi.length) {
          E("opsi").innerHTML = "";
          return;
        }
        E("opsi").innerHTML = m.opsi
          .map(
            (o) =>
              `<div class="ol">${o.l}</div><div class="og" data-key="${o.k}">${o.p.map((v) => `<button class="o ${INP[o.k] === v ? "on" : ""}" data-v="${v}">${o.t(v)}</button>`).join("")}</div>`,
          )
          .join("");
        document.querySelectorAll("#opsi .og").forEach((g) =>
          g.querySelectorAll("button").forEach(
            (b) =>
              (b.onclick = () => {
                INP[g.dataset.key] = Number(b.dataset.v);
                opsi();
                reset();
              }),
          ),
        );
      }
      function fullkode() {
        const m = M[AK];
        if (!m.full) {
          E("full").innerHTML = "";
          return;
        }
        const txt = esc(m.full).replace(
          /(\/\/[^\n]*)/g,
          '<span class="cm">$1</span>',
        );
        E("full").innerHTML =
          `<div class="full"><div class="fh"><span>siap dikompilasi</span><button class="cp" id="cpb">Salin</button></div><pre>${txt}</pre></div>`;
        E("cpb").onclick = () => {
          navigator.clipboard.writeText(m.full).then(() => {
            const b = E("cpb");
            b.textContent = "Tersalin";
            b.classList.add("ok");
            setTimeout(() => {
              b.textContent = "Salin";
              b.classList.remove("ok");
            }, 1400);
          });
        };
      }
      function reset() {
        stop();
        S = M[AK].build(INP);
        I = 0;
        draw();
      }
      function draw() {
        const m = M[AK],
          s = S[I],
          last = S.length - 1;
        E("stt").textContent = `Langkah ${I} dari ${last}`;
        const t = TAG[s.tag] || TAG.mulai;
        E("nr").innerHTML =
          `<span class="tg" style="color:${t[1]};background:${t[2]};border-color:${t[3]}">${t[0]}</span>${s.d}`;
        const kls = KLS[s.tag] || "";
        const kode = `<div class="code">${m.kode
          .map((ln, k) => {
            const on = s.ln.indexOf(k + 1) >= 0;
            const txt = esc(ln).replace(
              /(\/\/.*)$/,
              '<span class="cm">$1</span>',
            );
            return `<div class="cb ${on ? "on " + kls : ""}"><span class="n">${ln === "" ? "" : k + 1}</span><span class="t">${txt}</span></div>`;
          })
          .join("")}</div>`;
        E("kol1").innerHTML = kode + (m.kiri ? m.kiri(s, INP) : "");
        E("kol2").innerHTML = m.kanan ? m.kanan(s, INP) : "";
        E("hasil").innerHTML = m.end ? m.end(s, INP) : "";
        E("bp").disabled = I === 0;
        E("bn").disabled = I === last;
      }
      function go(d) {
        const l = S.length - 1;
        I = Math.min(l, Math.max(0, I + d));
        if (I === l) stop();
        draw();
      }
      function stop() {
        if (T) {
          clearInterval(T);
          T = null;
        }
        E("ba").textContent = "Putar";
        E("ba").classList.remove("run");
      }
      E("bn").onclick = () => go(1);
      E("bp").onclick = () => go(-1);
      E("br").onclick = () => {
        I = 0;
        stop();
        draw();
      };
      E("bs").onclick = () => {
        stop();
        I = S.length - 1;
        draw();
      };
      E("ba").onclick = () => {
        if (T) {
          stop();
          return;
        }
        if (I === S.length - 1) I = 0;
        E("ba").textContent = "Jeda";
        E("ba").classList.add("run");
        T = setInterval(() => {
          if (I >= S.length - 1) {
            stop();
            return;
          }
          I++;
          draw();
        }, 480);
      };
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "BUTTON" && e.key === " ") return;
        if (e.key === "ArrowRight") {
          e.preventDefault();
          go(1);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          go(-1);
        } else if (e.key === " ") {
          e.preventDefault();
          E("ba").click();
        }
      });
      function test() {
        const m = M[AK];
        if (!m.tests) {
          E("tc").innerHTML = "";
          return;
        }
        let h =
          '<table class="tc"><tr><th style="width:36%">Input</th><th style="width:24%">Output</th><th>Menguji</th></tr>';
        m.tests.forEach((t) => {
          h += `<tr><td class="io">${esc(t[0]) || '<span style="color:var(--pudar)">(kosong)</span>'}</td><td class="ou">${esc(t[1])}</td><td>${t[3] ? '<span class="tepi">tepi</span>' : ""}${t[2] || ""}</td></tr>`;
        });
        E("tc").innerHTML = h + "</table>";
      }
      function soal() {
        const m = M[AK];
        if (!m.soal) {
          E("soal").innerHTML = "";
          return;
        }
        const s = m.soal;
        E("soal").innerHTML = `<div class="sl"><h4>${s.j}</h4><p>${s.i}</p>
  <dl>${s.io.map((x) => `<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>
  ${s.c ? `<div class="ct"><b>Catatan.</b> ${s.c}</div>` : ""}</div>`;
      }
      pilih("perahu");
    </script>
  </body>
</html>
