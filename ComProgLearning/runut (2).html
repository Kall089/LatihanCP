<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runut — Visualisasi Algoritma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f5f3;
        --putih: #ffffff;
        --tinta: #16191c;
        --sedang: #54606b;
        --pudar: #8b959d;
        --garis: #e3e5e2;
        --garis2: #d2d5d1;
        --aksen: #1c6f6a;

        --k-aktif: #8a5a00;
        --k-aktif-bg: #fbefd4;
        --k-aktif-br: #ebd5a3;
        --k-hasil: #0b6046;
        --k-hasil-bg: #dff0e7;
        --k-hasil-br: #a9d6c2;
        --k-buang: #9a3838;
        --k-buang-bg: #fae6e4;
        --k-buang-br: #ebbdb8;
        --k-stack: #43407f;
        --k-stack-bg: #eae9f6;
        --k-stack-br: #c4c1e6;

        --body: "Instrument Sans", system-ui, -apple-system, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--tinta);
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--k-aktif-bg);
      }

      .shell {
        display: grid;
        grid-template-columns: 236px 1fr;
        min-height: 100vh;
      }
      @media (max-width: 880px) {
        .shell {
          grid-template-columns: 1fr;
        }
      }

      /* ---------- RAIL ---------- */
      aside {
        border-right: 1px solid var(--garis);
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 28px 0 48px;
        background: var(--bg);
      }
      @media (max-width: 880px) {
        aside {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--garis);
          padding-bottom: 20px;
        }
      }
      .brand {
        padding: 0 24px 20px;
      }
      .brand h1 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .brand p {
        font-size: 12px;
        color: var(--pudar);
        margin-top: 2px;
      }
      .bab {
        padding: 20px 24px 7px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--pudar);
      }
      .nl {
        display: flex;
        gap: 11px;
        align-items: baseline;
        padding: 6px 24px;
        cursor: pointer;
        font-size: 13.5px;
        color: var(--sedang);
        transition: 0.12s;
        border-left: 2px solid transparent;
      }
      .nl .no {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--pudar);
        min-width: 16px;
      }
      .nl:hover {
        color: var(--tinta);
        background: rgba(0, 0, 0, 0.025);
      }
      .nl.on {
        color: var(--aksen);
        border-left-color: var(--aksen);
        font-weight: 600;
        background: rgba(28, 111, 106, 0.05);
      }
      .nl.on .no {
        color: var(--aksen);
      }

      /* ---------- MAIN ---------- */
      main {
        padding: 44px 44px 100px;
        max-width: 880px;
      }
      @media (max-width: 640px) {
        main {
          padding: 26px 18px 70px;
        }
      }

      .eb {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--pudar);
      }
      h2.jd {
        font-size: clamp(26px, 4.4vw, 34px);
        font-weight: 600;
        letter-spacing: -0.026em;
        line-height: 1.15;
        margin: 9px 0 8px;
      }
      .sb {
        color: var(--sedang);
        font-size: 15.5px;
        max-width: 60ch;
        margin-bottom: 34px;
      }

      .sec {
        margin: 44px 0 16px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .sec h3 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .sec .rl {
        flex: 1;
        height: 1px;
        background: var(--garis2);
      }

      /* materi */
      .mt {
        margin-bottom: 22px;
      }
      .mt h4 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 7px;
        letter-spacing: -0.01em;
      }
      .mt p {
        color: var(--sedang);
        font-size: 14.5px;
        max-width: 66ch;
      }
      .mt p + p {
        margin-top: 10px;
      }
      .mt strong {
        color: var(--tinta);
        font-weight: 600;
      }
      .mt.kunci {
        border-left: 2px solid var(--aksen);
        padding-left: 18px;
      }
      .mt.kunci h4 {
        color: var(--aksen);
      }
      code.c {
        font-family: var(--mono);
        font-size: 12.5px;
        background: rgba(0, 0, 0, 0.045);
        padding: 1.5px 5px;
        border-radius: 3px;
        color: var(--tinta);
      }

      /* ---------- KONTROL ---------- */
      .opt {
        margin-bottom: 20px;
      }
      .ol {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--pudar);
        margin-bottom: 6px;
      }
      .og {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 13px;
      }
      button.o {
        font-family: var(--body);
        font-size: 12.5px;
        background: var(--putih);
        color: var(--sedang);
        border: 1px solid var(--garis2);
        border-radius: 5px;
        padding: 6px 12px;
        cursor: pointer;
        transition: 0.12s;
      }
      button.o:hover {
        border-color: var(--pudar);
        color: var(--tinta);
      }
      button.o.on {
        background: var(--tinta);
        color: var(--putih);
        border-color: var(--tinta);
        font-weight: 500;
      }

      .bar {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 16px;
      }
      button.b {
        font-family: var(--body);
        font-size: 13.5px;
        background: var(--putih);
        color: var(--tinta);
        border: 1px solid var(--garis2);
        border-radius: 6px;
        padding: 8px 15px;
        cursor: pointer;
        transition: 0.12s;
      }
      button.b:hover:not(:disabled) {
        border-color: var(--pudar);
      }
      button.b:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      button.b.u {
        background: var(--tinta);
        color: var(--putih);
        border-color: var(--tinta);
        font-weight: 500;
      }
      button.b.u:hover:not(:disabled) {
        background: #000;
      }
      button.b.run {
        background: var(--aksen);
        color: #fff;
        border-color: var(--aksen);
      }

      .st {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--pudar);
        margin-bottom: 6px;
      }
      .nr {
        font-size: 14.5px;
        min-height: 48px;
        margin-bottom: 22px;
        color: var(--sedang);
        max-width: 70ch;
        line-height: 1.6;
      }
      .nr b {
        color: var(--tinta);
      }
      .tg {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.08em;
        font-weight: 700;
        padding: 3px 7px;
        border-radius: 3px;
        margin-right: 9px;
        vertical-align: 1.5px;
        border: 1px solid;
      }

      /* ---------- PANEL ---------- */
      .pn {
        background: var(--putih);
        border: 1px solid var(--garis);
        border-radius: 8px;
        padding: 18px 20px;
        margin-bottom: 14px;
      }
      .pl {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--pudar);
        margin-bottom: 13px;
      }
      .scroll {
        overflow-x: auto;
      }

      .row {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .cl {
        text-align: center;
      }
      .cl .i {
        font-family: var(--mono);
        font-size: 9.5px;
        color: var(--pudar);
        margin-bottom: 4px;
        height: 13px;
      }
      .cl .v {
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 500;
        min-width: 42px;
        padding: 9px 8px;
        border: 1px solid var(--garis2);
        border-radius: 5px;
        background: var(--putih);
        transition: 0.15s;
      }
      .cl .u {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--pudar);
        margin-top: 5px;
        height: 14px;
      }
      .cl.a .v {
        background: var(--k-aktif-bg);
        border-color: var(--k-aktif-br);
        color: var(--k-aktif);
        font-weight: 700;
      }
      .cl.h .v {
        background: var(--k-hasil-bg);
        border-color: var(--k-hasil-br);
        color: var(--k-hasil);
      }
      .cl.b .v {
        background: var(--k-buang-bg);
        border-color: var(--k-buang-br);
        color: var(--k-buang);
      }
      .cl.s .v {
        background: var(--k-stack-bg);
        border-color: var(--k-stack-br);
        color: var(--k-stack);
      }
      .cl.dim {
        opacity: 0.3;
      }

      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 820px) {
        .two {
          grid-template-columns: 1fr;
        }
      }

      /* ---------- KODE ---------- */
      .code {
        background: var(--putih);
        border: 1px solid var(--garis);
        border-radius: 8px;
        padding: 14px 0;
        overflow-x: auto;
        margin-bottom: 14px;
      }
      .cb {
        display: flex;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.9;
        border-left: 2px solid transparent;
      }
      .cb .n {
        width: 30px;
        flex: none;
        text-align: right;
        padding-right: 12px;
        color: #c3c8cc;
        user-select: none;
      }
      .cb .t {
        white-space: pre;
        color: var(--sedang);
        padding-right: 20px;
      }
      .cb .cm {
        color: var(--pudar);
      }
      .cb.on {
        background: var(--k-aktif-bg);
        border-left-color: var(--k-aktif-br);
      }
      .cb.on .t {
        color: var(--tinta);
      }
      .cb.on.h {
        background: var(--k-hasil-bg);
        border-left-color: var(--k-hasil-br);
      }
      .cb.on.b {
        background: var(--k-buang-bg);
        border-left-color: var(--k-buang-br);
      }
      .cb.on.s {
        background: var(--k-stack-bg);
        border-left-color: var(--k-stack-br);
      }

      /* ---------- HITUNG ---------- */
      .hg {
        background: var(--putih);
        border: 1px solid var(--garis);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 14px;
      }
      .hg .hh {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--pudar);
        padding: 14px 18px 9px;
      }
      .hr {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        border-top: 1px solid var(--garis);
      }
      .hr .l {
        font-size: 13.5px;
        color: var(--sedang);
        flex: 1;
      }
      .hr .e {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--pudar);
        text-align: right;
      }
      .hr .v {
        font-family: var(--mono);
        font-size: 17px;
        font-weight: 600;
        min-width: 42px;
        text-align: right;
        color: var(--tinta);
      }
      .hr.win {
        background: var(--k-hasil-bg);
      }
      .hr.win .v,
      .hr.win .l {
        color: var(--k-hasil);
      }
      .hr.lose .v {
        color: var(--pudar);
      }
      .sp {
        margin: 12px 18px 16px;
        padding: 10px 13px;
        border-radius: 6px;
        font-family: var(--mono);
        font-size: 12px;
        background: rgba(0, 0, 0, 0.03);
        border: 1px solid var(--garis);
      }
      .sp.ok {
        background: var(--k-hasil-bg);
        border-color: var(--k-hasil-br);
        color: var(--k-hasil);
      }
      .sp.no {
        background: var(--k-buang-bg);
        border-color: var(--k-buang-br);
        color: var(--k-buang);
      }

      /* ---------- STACK ---------- */
      .stk {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .fr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-family: var(--mono);
        font-size: 12.5px;
        padding: 8px 12px;
        border-radius: 5px;
        background: var(--putih);
        border: 1px solid var(--garis2);
        color: var(--sedang);
      }
      .fr.top {
        background: var(--k-stack-bg);
        border-color: var(--k-stack-br);
        color: var(--k-stack);
      }
      .fr .c {
        font-size: 9.5px;
        opacity: 0.75;
      }
      .kosong {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--pudar);
      }

      /* ---------- TABEL DP ---------- */
      table.dp {
        border-collapse: separate;
        border-spacing: 2px;
        font-family: var(--mono);
        font-size: 11.5px;
      }
      table.dp td.hd {
        padding: 3px 7px;
        color: var(--pudar);
        font-size: 10px;
        white-space: nowrap;
      }
      table.dp td.hd.on {
        color: var(--k-aktif);
        font-weight: 700;
      }
      .dc {
        min-width: 30px;
        padding: 7px 4px;
        text-align: center;
        border: 1px solid var(--garis2);
        border-radius: 4px;
        background: var(--putih);
      }
      .dc.f {
        background: #f0f5f2;
        border-color: #d6e4dc;
      }
      .dc.n {
        background: var(--k-aktif-bg);
        border-color: var(--k-aktif-br);
        color: var(--k-aktif);
        font-weight: 700;
      }
      .dc.a {
        background: var(--k-stack-bg);
        border-color: var(--k-stack-br);
        color: var(--k-stack);
      }
      .dc.b {
        background: var(--k-hasil-bg);
        border-color: var(--k-hasil-br);
        color: var(--k-hasil);
      }
      .dc.j {
        background: var(--k-hasil-bg);
        border-color: var(--k-hasil);
        color: var(--k-hasil);
        font-weight: 700;
      }

      /* ---------- HASIL ---------- */
      .hs {
        border: 1px solid var(--k-hasil-br);
        background: var(--k-hasil-bg);
        border-radius: 8px;
        padding: 16px 20px;
        margin-bottom: 14px;
      }
      .hs.no {
        border-color: var(--k-buang-br);
        background: var(--k-buang-bg);
      }
      .hs .a {
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--k-hasil);
      }
      .hs.no .a {
        color: var(--k-buang);
      }
      .hs .k {
        font-size: 13.5px;
        color: var(--sedang);
        margin-top: 4px;
      }

      /* ---------- TEST & SOAL ---------- */
      table.tc {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
        background: var(--putih);
        border: 1px solid var(--garis);
        border-radius: 8px;
        overflow: hidden;
      }
      table.tc th {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--pudar);
        text-align: left;
        padding: 11px 14px;
        border-bottom: 1px solid var(--garis);
        font-weight: 400;
        background: #fafbfa;
      }
      table.tc td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--garis);
        vertical-align: top;
        color: var(--sedang);
      }
      table.tc tr:last-child td {
        border-bottom: 0;
      }
      table.tc td.io {
        font-family: var(--mono);
        font-size: 12px;
        white-space: pre-line;
        color: var(--tinta);
      }
      table.tc td.ou {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        color: var(--k-hasil);
      }
      .tepi {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--k-buang);
        background: var(--k-buang-bg);
        border: 1px solid var(--k-buang-br);
        border-radius: 3px;
        padding: 1px 5px;
        margin-right: 8px;
        vertical-align: 1px;
      }

      .sl {
        background: var(--putih);
        border: 1px solid var(--garis);
        border-radius: 8px;
        padding: 20px 22px;
      }
      .sl h4 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .sl > p {
        color: var(--sedang);
        font-size: 14px;
        max-width: 66ch;
      }
      .sl dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 20px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--garis);
      }
      .sl dt {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--pudar);
        padding-top: 3px;
      }
      .sl dd {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--tinta);
        white-space: pre-line;
      }
      .sl .ct {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--garis);
        font-size: 13.5px;
        color: var(--sedang);
      }
      .sl .ct b {
        color: var(--aksen);
      }

      svg text {
        font-family: var(--mono);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand">
          <h1>Runut</h1>
          <p>visualisasi algoritma</p>
        </div>
        <nav id="nav"></nav>
      </aside>

      <main>
        <div class="eb" id="eb"></div>
        <h2 class="jd" id="jd"></h2>
        <p class="sb" id="sb"></p>

        <div id="materi"></div>

        <div class="sec">
          <h3>Jalankan</h3>
          <div class="rl"></div>
        </div>
        <div class="opt" id="opsi"></div>
        <div class="bar">
          <button class="b" id="bp">← Mundur</button>
          <button class="b u" id="bn">Maju →</button>
          <button class="b" id="ba">Putar</button>
          <button class="b" id="bs">Ke hasil</button>
          <button class="b" id="br">Ulang</button>
        </div>
        <div class="st" id="stt"></div>
        <p class="nr" id="nr"></p>

        <div class="two">
          <div id="kol1"></div>
          <div id="kol2"></div>
        </div>
        <div id="hasil"></div>

        <div class="sec">
          <h3>Test case</h3>
          <div class="rl"></div>
        </div>
        <div id="tc"></div>

        <div class="sec">
          <h3>Soal</h3>
          <div class="rl"></div>
        </div>
        <div id="soal"></div>
      </main>
    </div>

    <script>
      const E = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      const TAG = {
        mulai: ["MULAI", "var(--pudar)", "transparent", "var(--garis2)"],
        cek: [
          "CEK",
          "var(--k-aktif)",
          "var(--k-aktif-bg)",
          "var(--k-aktif-br)",
        ],
        pilih: [
          "PILIH",
          "var(--k-aktif)",
          "var(--k-aktif-bg)",
          "var(--k-aktif-br)",
        ],
        ambil: [
          "AMBIL",
          "var(--k-hasil)",
          "var(--k-hasil-bg)",
          "var(--k-hasil-br)",
        ],
        rekor: [
          "REKOR",
          "var(--k-hasil)",
          "var(--k-hasil-bg)",
          "var(--k-hasil-br)",
        ],
        jawab: [
          "JAWAB",

            ["Input", "Baris 1: n\nBaris 2: n bilangan"],
            ["Output", "Satu bilangan"],
            ["Batas", "1 ≤ n ≤ 10⁵, 0 ≤ a[i] ≤ 10⁴"],
            ["Contoh", "5\n2 7 9 3 1"],
            ["Hasil", "12"],
          ],
          c: "Perhatikan kasus n = 1 dan n = 2 secara terpisah sebelum loop.",
        },
      };

      /* ============ RUNTIME ============ */
      const URUT = [
        "paren",
        "permut",
        "kadane",
        "circ",
        "mono",
        "air",
        "freq",
        "acara",
        "bensin",
        "memo",
        "coin",
        "knap",
        "rumah",
      ];
      let AK = "paren",
        S = [],
        I = 0,
        T = null,
        INP = {};

      function nav() {
        let h = "",
          bl = "";
        URUT.forEach((k) => {
          const m = M[k];
          if (m.bab !== bl) {
            h += `<div class="bab">${m.bab}</div>`;
            bl = m.bab;
          }
          h += `<div class="nl ${k === AK ? "on" : ""}" data-k="${k}"><span class="no">${m.no}</span><span>${m.judul}</span></div>`;
        });
        E("nav").innerHTML = h;
        document
          .querySelectorAll(".nl")
          .forEach((el) => (el.onclick = () => pilih(el.dataset.k)));
      }
      function pilih(k) {
        AK = k;
        const m = M[k];
        INP = Object.assign({}, m.inp || {});
        nav();
        E("eb").textContent = m.bab;
        E("jd").textContent = m.judul;
        E("sb").textContent = m.sub;
        E("materi").innerHTML = (m.materi || [])
          .map(
            (x) =>
              `<div class="mt ${x.k ? "kunci" : ""}"><h4>${x.h}</h4>${x.p.map((p) => `<p>${p}</p>`).join("")}</div>`,
          )
          .join("");
        opsi();
        test();
        soal();
        reset();
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      function opsi() {
        const m = M[AK];
        if (!m.opsi || !m.opsi.length) {
          E("opsi").innerHTML = "";
          return;
        }
        E("opsi").innerHTML = m.opsi
          .map(
            (o) =>
              `<div class="ol">${o.l}</div><div class="og" data-key="${o.k}">${o.p.map((v) => `<button class="o ${INP[o.k] === v ? "on" : ""}" data-v="${v}">${o.t(v)}</button>`).join("")}</div>`,
          )
          .join("");
        document.querySelectorAll("#opsi .og").forEach((g) =>
          g.querySelectorAll("button").forEach(
            (b) =>
              (b.onclick = () => {
                INP[g.dataset.key] = Number(b.dataset.v);
                opsi();
                reset();
              }),
          ),
        );
      }
      function reset() {
        stop();
        S = M[AK].build(INP);
        I = 0;
        draw();
      }
      function draw() {
        const m = M[AK],
          s = S[I],
          last = S.length - 1;
        E("stt").textContent = `Langkah ${I} dari ${last}`;
        const t = TAG[s.tag] || TAG.mulai;
        E("nr").innerHTML =
          `<span class="tg" style="color:${t[1]};background:${t[2]};border-color:${t[3]}">${t[0]}</span>${s.d}`;
        const kls = KLS[s.tag] || "";
        const kode = `<div class="code">${m.kode
          .map((ln, k) => {
            const on = s.ln.indexOf(k + 1) >= 0;
            const txt = esc(ln).replace(
              /(\/\/.*)$/,
              '<span class="cm">$1</span>',
            );
            return `<div class="cb ${on ? "on " + kls : ""}"><span class="n">${ln === "" ? "" : k + 1}</span><span class="t">${txt}</span></div>`;
          })
          .join("")}</div>`;
        E("kol1").innerHTML = kode + (m.kiri ? m.kiri(s, INP) : "");
        E("kol2").innerHTML = m.kanan ? m.kanan(s, INP) : "";
        E("hasil").innerHTML = m.end ? m.end(s, INP) : "";
        E("bp").disabled = I === 0;
        E("bn").disabled = I === last;
      }
      function go(d) {
        const l = S.length - 1;
        I = Math.min(l, Math.max(0, I + d));
        if (I === l) stop();
        draw();
      }
      function stop() {
        if (T) {
          clearInterval(T);
          T = null;
        }
        E("ba").textContent = "Putar";
        E("ba").classList.remove("run");
      }
      E("bn").onclick = () => go(1);
      E("bp").onclick = () => go(-1);
      E("br").onclick = () => {
        I = 0;
        stop();
        draw();
      };
      E("bs").onclick = () => {
        stop();
        I = S.length - 1;
        draw();
      };
      E("ba").onclick = () => {
        if (T) {
          stop();
          return;
        }
        if (I === S.length - 1) I = 0;
        E("ba").textContent = "Jeda";
        E("ba").classList.add("run");
        T = setInterval(() => {
          if (I >= S.length - 1) {
            stop();
            return;
          }
          I++;
          draw();
        }, 540);
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") {
          e.preventDefault();
          go(1);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          go(-1);
        } else if (e.key === " ") {
          e.preventDefault();
          E("ba").click();
        }
      });
      function test() {
        const m = M[AK];
        if (!m.tests) {
          E("tc").innerHTML = "";
          return;
        }
        let h =
          '<table class="tc"><tr><th style="width:38%">Input</th><th style="width:26%">Output</th><th>Menguji</th></tr>';
        m.tests.forEach((t) => {
          h += `<tr><td class="io">${esc(t[0])}</td><td class="ou">${esc(t[1])}</td><td>${t[3] ? '<span class="tepi">tepi</span>' : ""}${t[2] || ""}</td></tr>`;
        });
        E("tc").innerHTML = h + "</table>";
      }
      function soal() {
        const m = M[AK];
        if (!m.soal) {
          E("soal").innerHTML = "";
          return;
        }
        const s = m.soal;
        E("soal").innerHTML = `<div class="sl"><h4>${s.j}</h4><p>${s.i}</p>
   <dl>${s.io.map((x) => `<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl>
   ${s.c ? `<div class="ct"><b>Catatan.</b> ${s.c}</div>` : ""}</div>`;
      }
      pilih("paren");
    </script>
  </body>
</html>
